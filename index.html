    }

      border-bottom: 2px solid #eee;
      padding-bottom: 5px;

    .item-card {
      display: inline-block;

      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      background: #fff;

    .item-card img {

      object-fit: cover;

    .item-info {

    }

    .item-info p {
      margin: 5px 0;
    }

    .item-btn {
      background: #f57c00;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 5px;
    }

    .item-btn:hover {

    }

    #order-summary {
      margin-top: 30px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
    }

    #order-summary ul {
      padding-left: 20px;

    const order = [];

    function renderMenu() {
      const menuDiv = document.getElementById('menu');
      for (const category in menu) {
        const group = document.createElement('div');
        group.className = 'menu-group';
        group.innerHTML = `<h2>${category}</h2>`;

        menu[category].forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';

          card.innerHTML = `
            <img src="${item.img}" alt="${item.name}">
            <div class="item-info">
              <p>${item.name}</p>
              <p><strong>${item.price + 0}฿</strong></p>
              <button class="item-btn">สั่ง</button>
            </div>
          `;

          card.querySelector('.item-btn').onclick = () => addToOrder(item.name, item.price + 0);
          group.appendChild(card);
        });

        menuDiv.appendChild(group);
      }
    }

    function addToOrder(name, price) {
      const existing = order.find(i => i.name === name);
      if (existing) {
        existing.qty++;
      } else {
        order.push({ name, price, qty: 1 });
      }
      renderOrder();
    }

    function renderOrder() {
      const list = document.getElementById('order-list');
      list.innerHTML = '';
      let total = 0;
      order.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} x ${item.qty} = ${item.price * item.qty}฿`;
        list.appendChild(li);
        total += item.price * item.qty;
      });
      document.getElementById('total').textContent = total;
      console.log("📦 คำสั่งซื้อ:", order);
    }

    async function submitOrder() {
      const customerName = document.getElementById('customer-name').value;
      const totalAmount = document.getElementById('total').textContent;
      const submitBtn = document.getElementById('submit-btn');

      if (order.length === 0) {
        alert('กรุณาเลือกอาหารก่อนยืนยันครับ');
        return;
      }
      if (!customerName) {
        alert('กรุณาระบุบ้านหรือชื่อลูกค้าครับ');
        return;
      }

      let itemsText = '';
      order.forEach(item => {
        itemsText += `- ${item.name} x${item.qty} (${item.price * item.qty}฿)\n`;
      });

      const payload = {
        customer: customerName,
        items: itemsText,
        total: totalAmount
      };

      submitBtn.textContent = 'กำลังส่งออเดอร์...';
      submitBtn.disabled = true;
      submitBtn.style.background = '#6c757d';

      try {
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbzw3NCWI2noJFrFI4i6gWpWadYpSR82zo-g2xJkhRvvaYqZxukHdJCN6osAJDBd0GXv5Q/exec';
        
        const response = await fetch(webAppUrl, {
          method: 'POST',
          body: JSON.stringify(payload),
          mode: 'no-cors' // เพิ่ม no-cors เพื่อป้องกันปัญหาแจ้งเตือนข้ามโดเมน
        });

        alert('สั่งอาหารเรียบร้อยแล้ว! ร้านกำลังเตรียมอาหารให้ครับ');
        
        order.length = 0;
        renderOrder();
        document.getElementById('customer-name').value = '';

      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
      } finally {
        submitBtn.textContent = 'ยืนยันการสั่งอาหาร';
        submitBtn.disabled = false;
        submitBtn.style.background = '#28a745';
      }
    }

    // ✅ เรียกใช้งาน
    renderMenu();
